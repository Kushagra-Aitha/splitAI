<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Split AI</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      (function () {
        var t;
        try { t = localStorage.getItem('split-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="split-common-ground" aria-label="Split AI">
      <div class="shell">
        <header class="book-header" aria-label="Split navigation">
          <div class="book-brand">
            <button type="button" class="brand" data-go="home" aria-label="Split Overview"><span class="brand-mark" aria-hidden="true"></span>split<span class="brand-period">.</span></button>
            <span class="book-edition">YOUR EVERYDAY LEDGER</span>
          </div>

          <nav class="book-nav" aria-label="Main navigation">
            <button type="button" class="nav-item cursor-interaction" data-page="home"><i data-lucide="overview" aria-hidden="true"></i><span>Overview</span></button>
            <button type="button" class="nav-item cursor-interaction" data-page="transactions"><i data-lucide="transactions" aria-hidden="true"></i><span>Transactions</span></button>
            <button type="button" class="nav-item cursor-interaction" data-page="groups"><i data-lucide="groups" aria-hidden="true"></i><span>Groups</span></button>
            <button type="button" class="nav-item cursor-interaction" data-page="goals"><i data-lucide="goals" aria-hidden="true"></i><span>Goals</span></button>
            <button type="button" class="nav-item cursor-interaction" data-page="profile"><i data-lucide="insights" aria-hidden="true"></i><span>Insights</span></button>
            <button type="button" class="nav-item cursor-interaction" data-page="chat"><i data-lucide="ask" aria-hidden="true"></i><span>Ask</span></button>
            <button type="button" class="nav-item cursor-interaction" data-page="guard"><i data-lucide="guard" aria-hidden="true"></i><span>Guard</span></button>
          </nav>

          <div class="header-actions">
            <div id="sp-notifications"></div>
            <div class="account">
              <button type="button" id="sp-account-button" class="account-button cursor-interaction" aria-haspopup="menu" aria-expanded="false" aria-controls="sp-account-menu">
                <span data-account-avatar></span>
                <span class="account-first" data-account-first></span>
                <i data-lucide="chevron-down" aria-hidden="true"></i>
              </button>
              <div id="sp-account-menu" class="account-menu" role="menu" aria-labelledby="sp-account-button" hidden>
                <div class="account-menu-head" role="none">
                  <span data-account-avatar data-size="lg"></span>
                  <div><strong data-account-name></strong><span class="small muted" data-account-email></span></div>
                </div>
                <button type="button" role="menuitem" class="account-menu-bank" data-action="bank-manage">
                  <i data-lucide="landmark" aria-hidden="true"></i>
                  <span><span class="small muted">Connected bank</span><strong data-account-bank>Capital Two</strong></span>
                </button>
                <button type="button" role="menuitem" class="account-menu-item" id="sp-theme-toggle">
                  <i data-lucide="moon" aria-hidden="true"></i><i data-lucide="sun" aria-hidden="true"></i>
                  <span data-theme-label>Dark mode</span>
                </button>
                <div class="account-menu-sep" role="separator"></div>
                <button type="button" role="menuitem" class="account-menu-item is-danger" id="sp-logout">
                  <i data-lucide="sign-out" aria-hidden="true"></i>
                  <span>Log out</span>
                </button>
              </div>
            </div>
          </div>
        </header>

        <main class="main">
          <div id="sp-view"></div>
        </main>

        <button type="button" class="ask-fab cursor-interaction" data-ask-open aria-label="Ask Split" aria-controls="sp-ask-panel" aria-expanded="false"><i data-lucide="ask" aria-hidden="true"></i><span>Ask Split</span></button>

        <nav class="bottom-nav" aria-label="Main navigation">
          <button type="button" class="bottom-nav-item" data-page="home"><i data-lucide="overview" aria-hidden="true"></i><span>Overview</span></button>
          <button type="button" class="bottom-nav-item" data-page="transactions" aria-label="Ledger transactions"><i data-lucide="transactions" aria-hidden="true"></i><span>Ledger</span></button>
          <button type="button" class="bottom-nav-item" data-page="groups"><i data-lucide="groups" aria-hidden="true"></i><span>Groups</span></button>
          <button type="button" class="bottom-nav-item" data-page="goals"><i data-lucide="goals" aria-hidden="true"></i><span>Goals</span></button>
          <button type="button" class="bottom-nav-item" data-page="profile"><i data-lucide="insights" aria-hidden="true"></i><span>Insights</span></button>
          <button type="button" class="bottom-nav-item" data-page="chat"><i data-lucide="ask" aria-hidden="true"></i><span>Ask</span></button>
          <button type="button" class="bottom-nav-item" data-page="guard"><i data-lucide="guard" aria-hidden="true"></i><span>Guard</span></button>
        </nav>

        <div id="sp-modal-root"></div>
        <div id="sp-toast-root" aria-live="polite"></div>
        <div id="sp-announcement" class="sr-only" aria-live="polite"></div>
      </div>
      <input type="file" id="sp-receipt-file" accept="image/*" hidden />
    </div>
  </body>
</html>
